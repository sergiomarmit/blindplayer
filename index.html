<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BLIND PLAYER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="screen-login" class="screen active">
    <div class="login-container">
      <div class="logo-block">
        <span class="logo-blind">BLIND</span>
        <span class="logo-player">PLAYER</span>
        <p class="logo-sub">senti. non vedere.</p>
      </div>
      <button id="btn-login" class="btn-main">
        <span>Connetti Spotify</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.66 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.179-1.2-.181-1.38-.721-.18-.601.18-1.2.72-1.381 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
      </button>
      <p class="login-note">Richiede Spotify Premium</p>
    </div>
    <div class="bg-grid"></div>
  </div>

  <!-- PLAYLIST SELECT SCREEN -->
  <div id="screen-playlists" class="screen">
    <div class="top-bar">
      <span class="top-logo">BLIND</span>
      <button id="btn-logout" class="btn-ghost">logout</button>
    </div>

    <div class="playlists-container">
      <h1 class="section-title">Scegli<br/>una playlist</h1>
      <p class="section-sub">I brani verranno riprodotti in ordine casuale.<br/>Non vedrai nulla.</p>

      <div class="input-row">
        <input type="text" id="input-playlist-uri" placeholder="Incolla URL o URI Spotify…" autocomplete="off" spellcheck="false" />
        <button id="btn-load-uri" class="btn-small">Carica</button>
      </div>

      <div class="divider-row"><span>oppure scegli dalle tue playlist</span></div>

      <div id="playlists-grid" class="playlists-grid">
        <div class="loading-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

  <!-- PLAYER SCREEN -->
  <div id="screen-player" class="screen">
    <div class="top-bar">
      <button id="btn-back" class="btn-ghost">← playlist</button>
      <span class="top-logo">BLIND</span>
      <div class="top-status">
        <span id="status-dot" class="dot"></span>
        <span id="status-text">—</span>
      </div>
    </div>

    <div class="player-core">
      <!-- Il centro rimane deliberatamente vuoto -->
      <div class="void-zone">
        <div class="void-circle" id="void-circle">
          <div class="void-inner"></div>
        </div>
        <p class="void-label" id="void-label">premi play</p>
      </div>

      <!-- Progress bar - nessun testo, nessun nome -->
      <div class="progress-container">
        <div class="progress-track" id="progress-track">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
      </div>

      <!-- Controlli -->
      <div class="controls">
        <button id="btn-prev" class="ctrl-btn" title="Precedente">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 20L9 12l10-8v16z"/><line x1="5" y1="4" x2="5" y2="20"/></svg>
        </button>
        <button id="btn-play" class="ctrl-btn ctrl-main" title="Play/Pausa">
          <svg id="icon-play" width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          <svg id="icon-pause" width="28" height="28" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button id="btn-next" class="ctrl-btn" title="Successivo">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 4l10 8-10 8V4z"/><line x1="19" y1="4" x2="19" y2="20"/></svg>
        </button>
      </div>

      <!-- Volume - nascosto, solo slider -->
      <div class="volume-row">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" opacity="0.4"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
        <input type="range" id="volume-slider" min="0" max="100" value="80" />
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" opacity="0.4"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </div>
    </div>

    <!-- Track counter - solo numero, nessun titolo -->
    <div class="track-counter">
      <span id="track-num">—</span> <span class="counter-sep">/</span> <span id="track-total">—</span>
    </div>
  </div>

  <!-- ERROR TOAST -->
  <div id="toast" class="toast"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
  <!-- SDK Spotify caricato per ultimo: quando chiama onSpotifyWebPlaybackSDKReady il callback è già registrato -->
  <script src="https://sdk.scdn.co/spotify-player.js"></script>
</body>
</html>
